<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial;
            background: #f1f3f6;
        }

        .form {
            width: 100%;
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: rgb(245, 166, 166);
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .gender input,
        .terms input {
            width: auto;
        }

        .gender label {
            display: inline;
            margin-right: 10px;
        }

        .terms {
            margin: 15px 0;
        }

        .terms label {
            display: inline;
        }

        input[type="submit"] {
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .form {
                margin: 10px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="form">
    <h2>Registration Form</h2>

    <form>
        <label>Name:</label>
        <input type="text" required>

        <label>Email:</label>
        <input type="email" required>

        <label>Password:</label>
        <input type="password" required>

        <label>Date of Birth:</label>
        <input type="date" required>

        <div class="gender">
            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </div>

        <label>Department:</label>
        <select>
            <option>CS</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>CE</option>
        </select>

        <div class="terms">
            <input type="checkbox" required>
            I accept the terms and conditions
        </div>

        <input type="submit" value="Register">
    </form>
